<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mes Voyages</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F6F5F1">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1 class="auth-title">Mes Voyages</h1>
      <p class="auth-subtitle">Planifiez vos prochaines aventures</p>
      <div class="auth-form">
        <input type="email" id="auth-email" placeholder="Email" class="auth-input" autocomplete="email" oninput="clearAuthError()">
        <input type="password" id="auth-password" placeholder="Mot de passe" class="auth-input" autocomplete="current-password" oninput="clearAuthError()">
        <div id="auth-error" class="auth-error hidden"></div>
        <button class="auth-btn primary" onclick="loginUser()">Se connecter</button>
        <button class="auth-btn secondary" onclick="registerUser()">Créer un compte</button>
        <div class="auth-divider"><span>ou</span></div>
        <button class="auth-btn google" onclick="loginGoogle()">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuer avec Google
        </button>
        <button class="auth-btn skip" onclick="loginDemo()">Explorer en mode démo</button>
      </div>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="app" class="app hidden">

    <!-- HEADER -->
    <header class="header">
      <h1 class="header-title">Mes Voyages</h1>
      <div class="header-actions">
        <button class="header-btn" onclick="openAddModal()" title="Ajouter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="header-btn avatar" onclick="toggleUserMenu()" id="user-avatar-btn">M</button>
      </div>
    </header>

    <!-- USER MENU -->
    <div id="user-menu" class="user-menu hidden">
      <div class="user-menu-info">
        <span id="user-menu-email">demo@mesvoyages.app</span>
      </div>
      <button class="user-menu-item" onclick="logout()">Se déconnecter</button>
    </div>

    <!-- VIEWS CONTAINER -->
    <main class="views-container">

      <!-- LIST VIEW -->
      <div id="view-list" class="view">
        <div class="list-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Rechercher…" oninput="onSearch()">
        </div>
        <div class="list-filters" id="list-filters">
          <button class="filter-btn active" data-filter="all" onclick="toggleFilter('all')">Tous</button>
          <button class="filter-btn active" data-filter="done" onclick="toggleFilter('done')">Visités</button>
          <button class="filter-btn active" data-filter="planned" onclick="toggleFilter('planned')">Planifiés</button>
          <button class="filter-btn active" data-filter="idea" onclick="toggleFilter('idea')">Idées</button>
        </div>
        <div class="list-months" id="month-bar"></div>
        <div id="list-content"></div>
      </div>

      <!-- MAP VIEW -->
      <div id="view-map" class="view hidden">
        <div id="map"></div>
      </div>

      <!-- PLANNING VIEW -->
      <div id="view-planning" class="view hidden">
        <div class="planning-header">
          <button class="planning-nav" onclick="changePlanningYear(-1)">‹</button>
          <span class="planning-year" id="planning-year">2026</span>
          <button class="planning-nav" onclick="changePlanningYear(1)">›</button>
        </div>
        <div class="planning-grid" id="planning-grid"></div>
        <div class="planning-legend" id="planning-legend"></div>
      </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-tab" data-view="map" onclick="switchView('map')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span>Carte</span>
      </button>
      <button class="nav-tab active" data-view="list" onclick="switchView('list')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Liste</span>
      </button>
      <button class="nav-tab" data-view="planning" onclick="switchView('planning')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Planning</span>
      </button>
    </nav>
  </div>

  <!-- ============ ADD/EDIT MODAL ============ -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title">Nouvelle destination</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Destination</label>
          <input type="text" id="dest-name" placeholder="Ex: Santorini" oninput="onDestNameInput()">
          <div id="geocode-suggestions" class="suggestions hidden"></div>
        </div>
        <div class="form-group">
          <label>Pays</label>
          <input type="text" id="dest-country" placeholder="Auto-détecté…" readonly>
        </div>
        <div class="form-group">
          <label>Statut</label>
          <div class="status-select">
            <button class="status-btn" data-status="idea" onclick="setStatus('idea')">💡 Idée</button>
            <button class="status-btn active" data-status="planned" onclick="setStatus('planned')">📅 Planifié</button>
            <button class="status-btn" data-status="done" onclick="setStatus('done')">✅ Visité</button>
          </div>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="dest-notes" placeholder="Vos notes…" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Tags</label>
          <input type="text" id="dest-tags" placeholder="Ex: plage, culture, gastro">
        </div>
        <div class="form-group">
          <label>Photo</label>
          <div class="photo-input-row">
            <input type="text" id="dest-photo" placeholder="URL de la photo ou recherche auto…" oninput="onPhotoUrlInput()">
            <button type="button" class="photo-search-btn" onclick="searchPhoto()" title="Rechercher une photo">🔍</button>
          </div>
          <div id="photo-preview" class="photo-preview hidden"></div>
        </div>
        <div class="form-group">
          <label>Temps de vol (depuis Paris)</label>
          <input type="text" id="dest-flight" placeholder="Ex: 3h30">
        </div>
        <div class="form-group">
          <label>Meilleurs mois</label>
          <input type="text" id="dest-best-months" placeholder="Ex: avr–oct">
        </div>
        <div class="form-group" id="dates-section">
          <label>Dates de voyage</label>
          <div id="date-rows"></div>
          <button class="add-date-btn" onclick="addDateRow()">+ Ajouter des dates</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn delete hidden" id="modal-delete-btn" onclick="deleteDestination()">Supprimer</button>
        <button class="modal-btn save" onclick="saveDestination()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ============ DETAIL MODAL ============ -->
  <div id="detail-overlay" class="modal-overlay hidden" onclick="closeDetail()">
    <div class="modal detail-modal" onclick="event.stopPropagation()">
      <div class="detail-photo" id="detail-photo"></div>
      <button class="modal-close detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-body" id="detail-body"></div>
      <div class="detail-footer">
        <button class="modal-btn edit" onclick="editFromDetail()">Modifier</button>
      </div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast hidden"></div>

  <!-- ============ CONFIRM DIALOG ============ -->
  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="confirm-dialog">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button class="modal-btn secondary" onclick="confirmCancel()">Annuler</button>
        <button class="modal-btn delete" onclick="confirmOk()">Supprimer</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
